name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest --cov=rag_lab --cov-report=xml --cov-fail-under=85
      - run: uv run rag-lab evaluate --output reports/ci-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.python }}
          path: |
            coverage.xml
            reports/ci-evaluation.json
